<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <title>Kalkulator Pro</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div class="app">
        <header>
            <h1>Kalkulator</h1>
        </header>
        
        <main class="calculator">
            <div class="display-container">
                <div class="previous-operand" data-previous-operand></div>
                <div class="current-operand" data-current-operand>0</div>
            </div>

            <div class="buttons-grid">
                <button class="span-two" data-action="all-clear">AC</button>
                <button data-action="delete">DEL</button>
                <button class="operator" data-operation>÷</button>
                
                <button data-number>1</button>
                <button data-number>2</button>
                <button data-number>3</button>
                <button class="operator" data-operation>*</button>
                
                <button data-number>4</button>
                <button data-number>5</button>
                <button data-number>6</button>
                <button class="operator" data-operation>+</button>
                
                <button data-number>7</button>
                <button data-number>8</button>
                <button data-number>9</button>
                <button class="operator" data-operation>-</button>
                
                <button data-number>.</button>
                <button data-number>0</button>
                <button class="span-two" data-action="equals">=</button>
            </div>
        </main>
    </div>

    <script type="text/javascript" src="cordova.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
